<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200"><rect width="800" height="1200" fill="#e9eadf"/><text x="48" y="56" fill="#243c37" font-family="Arial" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">VICKY / CREATIVE PRACTICE</text><text x="752" y="56" fill="#243c37" font-family="Arial" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">14</text><path d="M48,80 L752,80" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="143" fill="#243c37" font-family="Georgia" font-size="53" font-weight="400" text-anchor="start" letter-spacing="0">Creative QA</text><text x="50" y="205" fill="#677972" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Every conclusion needs the right evidence.</text><rect x="48" y="271" width="342" height="181" rx="15" fill="#f8f6eb" stroke="none"/><text x="70" y="303" fill="#517969" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1">STRUCTURE</text><text x="70" y="360" fill="#243c37" font-family="Georgia" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0">Build</text><text x="70" y="408" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Can it produce an artifact?</text><rect x="410" y="271" width="342" height="181" rx="15" fill="#e4e9dd" stroke="none"/><text x="432" y="303" fill="#517969" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1">PICTURE + SOUND</text><text x="432" y="360" fill="#243c37" font-family="Georgia" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0">Dynamic review</text><text x="432" y="408" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Do performance and cuts work?</text><rect x="48" y="479" width="342" height="181" rx="15" fill="#e8dcd7" stroke="none"/><text x="70" y="511" fill="#517969" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1">INTERACTION</text><text x="70" y="568" fill="#243c37" font-family="Georgia" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0">Full experience</text><text x="70" y="616" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Do choices lead to outcomes?</text><rect x="410" y="479" width="342" height="181" rx="15" fill="#dde5e8" stroke="none"/><text x="432" y="511" fill="#517969" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1">DEVICE</text><text x="432" y="568" fill="#243c37" font-family="Georgia" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0">Real device</text><text x="432" y="616" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Does it work on target hardware?</text><text x="48" y="744" fill="#517969" font-family="Arial" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">EVIDENCE STATES</text><rect x="48" y="774" width="164" height="34" rx="17" fill="#d7e5d1" stroke="none"/><text x="130.0" y="797" fill="#243c37" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="1">PASS</text><rect x="226" y="774" width="164" height="34" rx="17" fill="#e8c9bd" stroke="none"/><text x="308.0" y="797" fill="#243c37" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="1">FAIL</text><rect x="404" y="774" width="164" height="34" rx="17" fill="#ece0bc" stroke="none"/><text x="486.0" y="797" fill="#243c37" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="1">UNVERIFIED</text><rect x="582" y="774" width="164" height="34" rx="17" fill="#dde1df" stroke="none"/><text x="664.0" y="797" fill="#243c37" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="1">N/A</text><rect x="48" y="855" width="704" height="157" rx="15" fill="#fffdf2" stroke="#d1d9d0"/><text x="70" y="888" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Issue → repair → targeted regression</text><text x="70" y="916" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Version + object + observation + evidence</text><text x="70" y="979" fill="#243c37" font-family="Georgia" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">A build pass is not a real-device pass.</text><path d="M48,1085 L752,1085" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="1121" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">RULE / verified, failed and untested must remain distinguishable</text><text x="48" y="1161" fill="#677972" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="2">CREATIVE-QA</text></svg>