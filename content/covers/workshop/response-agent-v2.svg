<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200"><rect width="800" height="1200" fill="#eee5df"/><text x="48" y="56" fill="#243c37" font-family="Arial" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">VICKY / CREATIVE PRACTICE</text><text x="752" y="56" fill="#243c37" font-family="Arial" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">12</text><path d="M48,80 L752,80" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="143" fill="#243c37" font-family="Georgia" font-size="53" font-weight="400" text-anchor="start" letter-spacing="0">Response Director</text><text x="50" y="205" fill="#677972" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Understand the whole sentence, not a keyword.</text><text x="48" y="292" fill="#517969" font-family="Arial" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">EXAMPLE INPUT</text><rect x="48" y="319" width="704" height="152" rx="18" fill="#fffcf5" stroke="none"/><text x="78" y="375" fill="#243c37" font-family="Georgia" font-size="40" font-weight="400" text-anchor="start" letter-spacing="0">“No hand-holding.</text><text x="78" y="425" fill="#243c37" font-family="Georgia" font-size="40" font-weight="400" text-anchor="start" letter-spacing="0">You can stay.”</text><path d="M400,471 L400,520" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M220,520 L580,520" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M220,520 L220,554" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M215,546 L220,554 L225,546" fill="none" stroke="#517969" stroke-width="2"/><path d="M580,520 L580,554" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M575,546 L580,554 L585,546" fill="none" stroke="#517969" stroke-width="2"/><rect x="48" y="566" width="334" height="126" rx="15" fill