<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200"><rect width="800" height="1200" fill="#e1e8e0"/><text x="48" y="56" fill="#243c37" font-family="Arial" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">VICKY / CREATIVE PRACTICE</text><text x="752" y="56" fill="#243c37" font-family="Arial" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">11</text><path d="M48,80 L752,80" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="143" fill="#243c37" font-family="Georgia" font-size="53" font-weight="400" text-anchor="start" letter-spacing="0">Video Harness</text><text x="50" y="205" fill="#677972" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Only reviewed output advances the state.</text><rect x="81" y="261" width="638" height="93" rx="15" fill="#f8faf2" stroke="#d1d9d0"/><text x="103" y="294" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">01  Interpret</text><text x="103" y="322" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Event + current scene state</text><path d="M400,354 L400,380" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M395,372 L400,380 L405,372" fill="none" stroke="#517969" stroke-width="2"/><rect x="81" y="386" width="638" height="93" rx="15" fill="#f8faf2" stroke="#d1d9d0"/><text x="103" y="419" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">02  Plan</text><text x="103" y="447" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">A proposal, not an accepted result</text><path d="M400,479 L400,505" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M395,497 L400,505 L405,497" fill="none" stroke="#517969" stroke-width="2"/><rect x="81" y="511" width="638" height="93" rx="15" fill="#f8faf2" stroke="#d1d9d0"/><text x="103" y="544" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">03  Validate</text><text x="103" y="572" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Schema + allowed actions + revision</text><path d="M400,604 L400,630" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M395,622 L400,630 L405,622" fill="none" stroke="#517969" stroke-width="2"/><rect x="81" y="636" width="638" height="93" rx="15" fill="#f8faf2" stroke="#d1d9d0"/><text x="103" y="669" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">04  Submit / Collect</text><text x="103" y="697" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">One execution, recorded evidence</text><path d="M400,729 L400,755" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M395,747 L400,755 L405,747" fill="none" stroke="#517969" stroke-width="2"/><rect x="81" y="761" width="638" height="93" rx="15" fill="#f8faf2" stroke="#d1d9d0"/><text x="103" y="794" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">05  Review actual output</text><text x="103" y="822" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Inspect what really happened</text><path d="M400,854 L400,880" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M395,872 L400,880 L405,872" fill="none" stroke="#517969" stroke-width="2"/><rect x="81" y="886" width="638" height="93" rx="15" fill="#d2e0cf" stroke="#d1d9d0"/><text x="103" y="919" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">06  Accept end state</text><text x="103" y="947" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Only accepted output moves the story</text><path d="M48,1085 L752,1085" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="1121" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">TRACE / session ID · event ID · state revision · actual output</text><text x="48" y="1161" fill="#677972" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="2">VIDEO-HARNESS</text></svg>