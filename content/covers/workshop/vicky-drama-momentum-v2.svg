<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200"><rect width="800" height="1200" fill="#e4ebe2"/><text x="48" y="56" fill="#243c37" font-family="Arial" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">VICKY / CREATIVE PRACTICE</text><text x="752" y="56" fill="#243c37" font-family="Arial" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">06</text><path d="M48,80 L752,80" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="143" fill="#243c37" font-family="Georgia" font-size="53" font-weight="400" text-anchor="start" letter-spacing="0">Narrative</text><text x="48" y="202" fill="#243c37" font-family="Georgia" font-size="53" font-weight="400" text-anchor="start" letter-spacing="0">Momentum</text><text x="50" y="264" fill="#677972" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Characters act. Choices leave consequences.</text><path d="M81,329 L81,950" fill="none" stroke="#8ba38e" stroke-width="3" stroke-dasharray=""/><circle cx="81" cy="352" r="23" fill="#517969"/><text x="81" y="359" fill="#ffffff" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">1</text><text x="122" y="348" fill="#243c37" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">A character wants something.</text><text x="122" y="379" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Goal + strategy + knowledge boundary</text><circle cx="81" cy="492" r="23" fill="#517969"/><text x="81" y="499" fill="#ffffff" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">2</text><text x="122" y="488" fill="#243c37" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">They take the initiative.</text><text x="122" y="519" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">A concrete action, even with little user input</text><circle cx="81" cy="632" r="23" fill="#517969"/><text x="81" y="639" fill="#ffffff" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">3</text><text x="122" y="628" fill="#243c37" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">The viewer can intervene.</text><text x="122" y="659" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Accept, refuse, redirect — each is understood</text><circle cx="81" cy="772" r="23" fill="#517969"/><text x="81" y="779" fill="#ffffff" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">4</text><text x="122" y="768" fill="#243c37" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">Something actually changes.</text><text x="122" y="799" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">A promise kept, a revealed fact, a new relationship</text><circle cx="81" cy="912" r="23" fill="#517969"/><text x="81" y="919" fill="#ffffff" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">5</text><text x="122" y="908" fill="#243c37" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">The next turn remembers.</text><text x="122" y="939" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">No reset. No repeated misunderstanding.</text><path d="M48,1085 L752,1085" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="1121" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">ENGINE / goal → action → consequence → inherited state</text><text x="48" y="1161" fill="#677972" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="2">VICKY-DRAMA-MOMENTUM</text></svg>