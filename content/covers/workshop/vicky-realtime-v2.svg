9" stroke-width="2"/><rect x="95" y="794" width="610" height="91" rx="15" fill="#ffffff" stroke="#d1d9d0"/><text x="117" y="827" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Play both clips continuously</text><text x="117" y="855" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Review the end frame before the next turn</text><path d="M400,885 L400,926" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M395,918 L400,926 L405,918" fill="none" stroke="#517969" stroke-width="2"/><rect x="205" y="943" width="390" height="34" rx="17" fill="#dce6dd" stroke="none"/><text x="400.0" y="966" fill="#243c37" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="1">NEXT TURN / INHERITED STATE</text><path d="M48,1085 L752,1085" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="1121" fill="#677972" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">CHAIN / input → plan → parallel clips → review → continuation</text><text x="48" y="1161" fill="#677972" font-family="Arial" font-size="12" font-weight="400" text-anchor="start" letter-spacing="2">VICKY-REALTIME</text></svg>