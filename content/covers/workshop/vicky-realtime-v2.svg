<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200"><rect width="800" height="1200" fill="#e6e9ef"/><text x="48" y="56" fill="#243c37" font-family="Arial" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">VICKY / CREATIVE PRACTICE</text><text x="752" y="56" fill="#243c37" font-family="Arial" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">04</text><path d="M48,80 L752,80" fill="none" stroke="#aebdb1" stroke-width="1" stroke-dasharray=""/><text x="48" y="143" fill="#243c37" font-family="Georgia" font-size="53" font-weight="400" text-anchor="start" letter-spacing="0">Realtime Direction</text><text x="50" y="205" fill="#677972" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Your input becomes the next moving scene.</text><rect x="48" y="268" width="704" height="85" rx="15" fill="#ffffff" stroke="#d1d9d0"/><text x="70" y="301" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Viewer input + character + scene state</text><text x="70" y="329" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">A choice or free text, with the story so far</text><path d="M400,353 L400,386" fill="none" stroke="#517969" stroke-width="2" stroke-dasharray=""/><path d="M395,378 L400,386 L405,378" fill="none" stroke="#517969" stroke-width="2"/><rect x="130" y="395" width="540" height="85" rx="15" fill="#d8e2e7" stroke="#d1d9d0"/><text x="152" y="428" fill="#243c37" font-family="Arial" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Writer / Director → validated plan</text><text x="152" y="456" fill="#677972" font-family="Arial" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Reply to meaning, stage an action, offer a hook</text><path d="M400,480 L400,509" fill="none" stroke="#517969" stroke-width="2" stroke-dasharra